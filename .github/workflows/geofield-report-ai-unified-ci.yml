name: GeoField unified engineering AI report and Windows candidate

on:
  push:
    branches:
      - work/geofield-report-ai-unified-20261104
      - work/geofield-lbracket-hole-evidence-report-20261104
      - work/geofield-post-p87-deadcode-cleanup-20261104
      - work/geofield-ai-mesh-feedback-loop-20261104
      - work/geofield-lbracket-d6-copy-20261104
      - work/geofield-d6-real-fea-descriptive-compare-20261104
      - work/geofield-d6-physical-load-screen-20261104
      - work/geofield-d6-real-solver-acceptance-20261104
      - work/geofield-windows-legacy-upgrade-compat-fix-20261104
      - work/geofield-windows-python313-full-qa-20261104
      - work/geofield-ai-evidence-clarity-followup-20261104
      - work/geofield-oneclick-fea-stage1-20261104
      - work/geofield-oneclick-auto-mesh-hotspot-stage2-20261104
      - work/geofield-oneclick-unified-report-stage3-20261105
      - work/geofield-oneclick-history-compare-stage4-20261105
      - work/geofield-oneclick-ui-simplify-stage5-20261105
      - work/geofield-full-regression-stabilize-stage6-20261105
      - work/geofield-stage7-ci-windows-acceptance-20261105
      - work/geofield-report-running-guard-20261105
      - work/geofield-preacceptance-evidence-closure-20261105
      - work/geofield-step1-cross-module-provenance-20261105
    paths:
      - 'src/**'
      - '.github/workflows/geofield-report-ai-unified-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  report-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile backend and frontend sources
        run: |
          python -m py_compile src/payload/GeoField_CAD_Analysis.py src/payload/fea_solver.py
          node --check src/payload/frontend/cad.js
      - name: Verify report AI ON/OFF, single paid request, fallback and export
        run: |
          node src/tests/test_d6_comparison_report_ui.js
          node src/tests/test_fea_d6_cross_geometry_ui.js
          node src/tests/test_lbracket_d6_copy_ui.js
          node src/tests/test_ai_mesh_feedback_ui.js
          node src/tests/test_b05_verified_report_ui.js
          node src/tests/test_results_verified_fea_ai_status.js
          node src/tests/test_results_oneclick_ai.js
          node src/tests/test_fea_oneclick_flow_ui.js
          node src/tests/test_fea_stage2_auto_mesh_hotspot_ui.js
          node src/tests/test_fea_stage3_auto_unified_report_ui.js
          node src/tests/test_fea_stage4_auto_archive_compare_ui.js
          node src/tests/test_fea_stage5_simple_ui.js
          node src/tests/test_fea_stage6_evidence_display_ui.js
          node src/tests/test_fea_preacceptance_evidence_checklist.js
          node src/tests/test_step1_cad_fea_ml_ai_provenance.js
          node src/tests/test_agent_ui.js
          node src/tests/test_agent_connection_ui.js
      - name: Verify native FEA evidence, prompt, bounds and legacy cleanup
        run: |
          python -m unittest discover -s src/tests -p 'test_windows_staged_api_upgrade.py' -v
          python -m unittest discover -s src/tests -p 'test_runtime_preflight.py' -v
          python -m unittest discover -s src/tests -p 'test_ai_report_evidence_clarity.py' -v
          python -m unittest discover -s src/tests -p 'test_d6_ai_report_context.py' -v
          python -m unittest discover -s src/tests -p 'test_fea_d6_inp_physics_screen.py' -v
          python -m unittest discover -s src/tests -p 'test_fea_d6_cross_geometry.py' -v
          python -m unittest discover -s src/tests -p 'test_lbracket_d6_copy.py' -v
          python -m unittest discover -s src/tests -p 'test_ai_mesh_followup_contract.py' -v
          python -m unittest discover -s src/tests -p 'test_hole_report_integration.py' -v
          python -m unittest discover -s src/tests -p 'test_strict_hole_occupancy_contract.py' -v
          python -m unittest discover -s src/tests -p 'test_engineering_ai_evidence_contract.py' -v
          python -m unittest discover -s src/tests -p 'test_agent_external_report_binding.py' -v
          python -m unittest discover -s src/tests -p 'test_safe_legacy_cleanup.py' -v
          python -m unittest discover -s src/tests -p 'test_ui_workflow_focus.py' -v
          python -m unittest discover -s src/tests -p 'test_fea_stage4_current_archive_binding.py' -v

  windows-candidate:
    needs: report-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch required immutable FEA and main refs
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/work/fea-validation:refs/remotes/origin/work/fea-validation
      - name: Build signed 26-file test candidate with production source
        run: |
          PYTHONPATH=src python -c "from pathlib import Path; from build_integration_candidate import build; build(Path('/tmp/geofield-unified-test-candidate'))"
          python /tmp/geofield-unified-test-candidate/verify_package.py
          python -c "import json; from pathlib import Path; p=Path('/tmp/geofield-unified-test-candidate'); m=json.loads((p/'manifest.json').read_text(encoding='utf8')); assert len(m['files'])==26; assert 'GEOFIELD_UNIFIED_REPORT_AI_V1' in (p/'payload/frontend/cad.js').read_text(encoding='utf8'); assert 'reportAiIncludeToggle' in (p/'payload/frontend/index.html').read_text(encoding='utf8'); assert 'GEOFIELD_ENGINEERING_AI_V1_20261104' in (p/'payload/GeoField_CAD_Analysis.py').read_text(encoding='utf8'); print('Unified engineering AI candidate: source and 26-file verification PASS')"

      - name: Verify Windows migration can replace old D6 API under exact-hash consent
        run: |
          python -c "from pathlib import Path; p=Path('/tmp/geofield-unified-test-candidate'); a=(p/'bootstrap.py').read_text(encoding='utf8'); b=(p/'runtime_preflight.py').read_text(encoding='utf8'); assert 'source_api_contract_before_update' in a; assert 'planned_update_modules' in a; assert '[POST-INSTALL API]' in a; assert 'planned_update_modules' in b; assert 'verified_candidate_after_approved_install' in b; assert 'MIGRATE CODE' in a; assert 'rollback_install(receipt)' in a; print('Legacy source API upgrade + explicit approval + post-install verification + rollback protected')"
      - name: Check obsolete AI cache is absent and current candidate labels are accurate
        run: |
          python -c "from pathlib import Path; p=Path('/tmp/geofield-unified-test-candidate'); backend=(p/'payload/GeoField_CAD_Analysis.py').read_text(encoding='utf8'); assert 'GF_AGENT_EXTERNAL_REPORT' not in backend; assert 'def gf_external_report_section(' not in backend; assert 'def gf_current_verified_report(' in backend; assert 'gf_append_local_hole_report(' in backend; notice=(p/'CANDIDATE_NOT_FINAL.txt').read_text(encoding='utf8'); assert 'AI report + B-Rep evidence' in notice; assert 'Do not stack earlier UI/AI hotfix ZIPs' in notice; print('No stale cached AI appendix; current candidate instructions PASS')"
      - name: Prove separate original vs D6 comparator is in the signed Windows package
        run: |
          python -c "from pathlib import Path; p=Path('/tmp/geofield-unified-test-candidate'); f=(p/'payload/fea_compare.py').read_text(encoding='utf8'); b=(p/'payload/GeoField_CAD_Analysis.py').read_text(encoding='utf8'); u=(p/'payload/frontend/cad.js').read_text(encoding='utf8'); h=(p/'payload/frontend/index.html').read_text(encoding='utf8'); assert 'GEOFIELD_D6_CROSS_GEOMETRY_COMPARE_V1' in f; assert 'GEOFIELD_D6_REAL_INP_PHYSICS_SCREEN_V1' in (p/'payload/fea_load_moment.py').read_text(encoding='utf8'); assert 'GEOFIELD_D6_REVERIFIED_ARCHIVE_PAIR_V1' in b; assert 'GEOFIELD_D6_REPORT_FEEDBACK_V1' in u; assert 'feaD6CompareRun' in h; assert 'GEOFIELD_UNIFIED_REPORT_AI_V1' in u; print('Verified D6 original-variant comparison and HTML report in signed 26-file candidate')"
      - name: Upload verified Windows test candidate, not final installed release
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-UNIFIED-Engineering-AI-Windows-Test-Candidate-NOT-FINAL
          path: /tmp/geofield-unified-test-candidate/
          if-no-files-found: error
          retention-days: 7


  windows-real-cmd-upgrade-acceptance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact source revisions required by the real candidate builder
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/work/fea-validation:refs/remotes/origin/work/fea-validation
      - name: Exercise actual CMD launcher against isolated fake Windows runtime
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_windows_cmd_install_only_checks_original_and_updated_backend -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_windows_cmd_install_only_failed_updated_health_rolls_back -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_cmd_refuses_private_restore_module_with_missing_export -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_user_screenshot_fifteen_unrecognized_files_migrate_as_one_backed_up_set -v

  windows-python313-full-distribution-audit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire exact known source baselines
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/work/fea-validation:refs/remotes/origin/work/fea-validation
      - name: Python 3.13 windows source and DOM smoke
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -c "import ast,pathlib; p=pathlib.Path('src/payload'); files=list(p.rglob('*.py')); [ast.parse(x.read_text(encoding='utf8'),filename=str(x)) for x in files]; print('Python 3.13 syntax:',len(files),'files')"
          node --check src/payload/frontend/cad.js
          python -c "import re,collections,pathlib; p=pathlib.Path('src/payload/frontend/index.html'); ids=re.findall(r'\bid=[\x22\x27]([^\x22\x27]+)',p.read_text(encoding='utf8')); assert not [x for x,n in collections.Counter(ids).items() if n>1]; print('No duplicate HTML element IDs')"
      - name: Full screenshot incompatibility and private-runtime safety suite
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s src/tests -p test_runtime_preflight.py -v
          python -m unittest discover -s src/tests -p test_windows_staged_api_upgrade.py -v
      - name: Real Windows CMD verify, install, rollback, tamper, audit
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_windows_cmd_verify_only_preserves_runtime -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_windows_cmd_install_only_checks_original_and_updated_backend -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_windows_cmd_install_only_failed_updated_health_rolls_back -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_cmd_runtime_audit_never_installs_even_when_all_files_present -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_cmd_refuses_private_restore_module_with_missing_export -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_windows_cmd_blocks_corrupt_package_before_bootstrap -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_candidate_integrity_rejects_added_file_and_edited_source_lock -v

  full-source-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every committed frontend JS synthetic regression
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          count=0
          for file in src/tests/test_*.js; do
            count=$((count+1))
            if ! node "$file"; then
              echo "::error::FAIL $file"
              failed=$((failed+1))
            fi
          done
          echo "Executed $count frontend regression scripts; failures=$failed"
          test "$failed" -eq 0
      - name: Execute all Python AI agent unittest regressions
        run: python -m unittest discover -s src/tests -p 'test_agent_*.py' -q

  real-two-solver-d6-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install genuine Gmsh and CalculiX (no mocked solver)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gmsh calculix-ccx
          /usr/bin/python3 -c 'import gmsh; print("Actual Gmsh:",gmsh.__version__)'
          ccx -v || true
          /usr/bin/python3 -m py_compile src/tests/verify_d6_two_real_fea_ci.py
      - name: Generate synthetic original/variant STEP and execute two real FEA runs
        shell: bash
        env:
          OMP_NUM_THREADS: '2'
          CCX_NPROC_EQUATION_SOLVER: '2'
        run: |
          set -euo pipefail
          /usr/bin/python3 src/tests/verify_d6_two_real_fea_ci.py
      - name: Preserve original and D6 actual INP STA FRD and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-real-D55-D60-Gmsh-CalculiX-evidence-NOT-user-STEP
          path: _real_d6_two_solver_evidence/
          if-no-files-found: warn
          retention-days: 7
