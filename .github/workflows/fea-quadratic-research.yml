name: FEA C3D4 vs C3D10 actual bending diagnostic
on:
  push:
    branches: [work/fea-validation]
    paths:
      - '.github/workflows/fea-quadratic-research.yml'
      - 'src/tests/verify_quadratic_bending_ci.py'
      - 'src/payload/fea_solver.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-quadratic-investigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install actual solver and Gmsh
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gmsh calculix-ccx
      - name: Solve identical public STEP with linear and quadratic tets
        env:
          OMP_NUM_THREADS: '2'
          CCX_NPROC_EQUATION_SOLVER: '2'
        run: /usr/bin/python3 src/tests/verify_quadratic_bending_ci.py
      - name: Preserve research solver evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geofield-real-c3d10-research-evidence
          path: _fea_quadratic_research_evidence/
          if-no-files-found: warn
          retention-days: 7
