name: GeoField FEA archive save-status and delete UI
on:
  push:
    branches: [work/geofield-history-ui-a07-20261028]
  pull_request:
    branches: [work/geofield-report-gate-integrate-20261028]
    paths:
      - src/payload/frontend/cad.js
      - src/payload/frontend/index.html
      - src/tests/test_fea_history_ui_a07.js
      - .github/workflows/geofield-history-ui-a07-ci.yml
permissions:
  contents: read
jobs:
  archive-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript
        run: node --check src/payload/frontend/cad.js
      - name: Run UI save status and irreversible-delete contract tests
        run: node src/tests/test_fea_history_ui_a07.js
      - name: Ensure existing archive/FEA UI race guards still work
        run: |
          node src/tests/test_fea_archive_identity.js
          node src/tests/test_fea_archive_preview_race.js
          node src/tests/test_fea_run_race.js
      - name: Install regression runner
        run: python -m pip install pytest
      - name: Run actual SQLite archive and deletion rollback regression (temporary data only)
        working-directory: src
        run: python -m pytest -q tests/test_fea_history_a03.py tests/test_fea_history_delete_a04.py
