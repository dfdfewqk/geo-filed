name: GeoField verified FEA HTML report gate
on:
  push:
    branches: [work/geofield-report-gate-integrate-20261028]
  pull_request:
    branches: [work/geofield-windows-fea-package-20261028]
    paths:
      - src/payload/GeoField_CAD_Analysis.py
      - src/tests/test_verified_analysis_report_gate.py
      - src/tests/test_fea_report_provenance.py
      - src/tests/test_agent_live_report.py
      - .github/workflows/geofield-verified-report-ci.yml
permissions:
  contents: read
jobs:
  report-evidence-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate production source syntax
        run: python -m py_compile src/payload/GeoField_CAD_Analysis.py
      - name: Install test framework only
        run: python -m pip install pytest
      - name: Reject unverified report HTML before rendering
        run: python -m pytest -q src/tests/test_verified_analysis_report_gate.py
      - name: Preserve real FEA provenance and existing rule-agent reports
        working-directory: src/tests
        run: python -m unittest test_fea_report_provenance test_agent_live_report -v
