name: FEA production C3D10 actual CCX 3-mesh
on:
  push:
    branches: [work/fea-validation]
    paths:
      - 'src/payload/fea_solver.py'
      - 'src/fea_compare.py'
      - 'src/fea_convergence.py'
      - 'src/tests/verify_production_c3d10_ci.py'
      - 'src/tests/test_fea_production_c3d10.py'
      - '.github/workflows/fea-production-c3d10.yml'
      - 'fixtures/L_bracket.step'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-three-mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install actual Gmsh and CalculiX
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gmsh calculix-ccx
      - name: Run actual production solver C3D10 three mesh sizes
        env:
          OMP_NUM_THREADS: '2'
          CCX_NPROC_EQUATION_SOLVER: '2'
        run: /usr/bin/python3 src/tests/verify_production_c3d10_ci.py
      - name: Preserve actual INP STA FRD DAT field evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geofield-production-c3d10-evidence
          path: _fea_production_c3d10_evidence/
          if-no-files-found: warn
          retention-days: 7
