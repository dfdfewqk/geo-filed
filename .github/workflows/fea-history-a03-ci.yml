name: GeoField A03 verified FEA history
on:
  push:
    branches:
      - work/geofield-fea-history-save-a03-20261028
    paths:
      - src/fea_history_a03.py
      - src/payload/GeoField_CAD_Analysis.py
      - src/tests/test_fea_history_a03.py
      - .github/workflows/fea-history-a03-ci.yml
  pull_request:
    branches:
      - work/geofield-ab-ai-c3d10-integration-20261026
    paths:
      - src/fea_history_a03.py
      - src/payload/GeoField_CAD_Analysis.py
      - src/tests/test_fea_history_a03.py
      - .github/workflows/fea-history-a03-ci.yml
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile src/fea_history_a03.py src/payload/GeoField_CAD_Analysis.py src/tests/test_fea_history_a03.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test actual temporary SQLite and FEA dispatch contracts
        env:
          PYTHONPATH: src:src/payload:src/tests
        run: python -m pytest -q src/tests/test_fea_history_a03.py src/tests/test_sqlite_archive_reverify.py src/tests/test_fea_restore_sqlite_snapshot_binding.py src/tests/test_restore_active_mesh_guard.py src/tests/test_agent_fea_comparison.py
