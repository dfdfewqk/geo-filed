name: GeoField ML automatic research inference regression

on:
  push:
    branches: [work/ml-runtime-r12]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geofield-ml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and automatic ML/agent evidence contracts
        run: |
          python -m py_compile src/payload/GeoField_CAD_Analysis.py src/payload/ml_evidence.py src/payload/ml_r12_bridge.py
          node --check src/payload/frontend/cad.js
          cd src/tests
          python -m unittest test_ml_auto_r12_fallback test_ml_brepmfr_runtime_fallback test_ml_worker_isolation test_ml_evidence test_ml_active_routes test_ml_r12_store test_ml_runtime_env test_ml_model_assets -v
  ml-real-step:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine research inference dependencies
        run: python -m pip install --disable-pip-version-check 'cadquery>=2.6,<2.9' 'scikit-learn>=1.4,<2' 'joblib>=1.3,<2'
      - name: Actual STEP / CadQuery / OCP / scikit-learn / frozen R12 checkpoint
        run: |
          python src/tests/verify_ml_real_r12_ci.py
          python src/tests/verify_ml_auto_pipeline_real_ci.py
  ml-windows-real-step:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real R12 inference libraries on Windows
        run: python -m pip install --disable-pip-version-check 'cadquery>=2.6,<2.9' 'scikit-learn>=1.4,<2' 'joblib>=1.3,<2'
      - name: Check Windows real STEP inference and archive tests
        run: |
          python -m py_compile src/payload/ml_r12_store.py src/payload/ml_r12_bridge.py
          python src/tests/verify_ml_real_r12_ci.py
          python src/tests/verify_ml_auto_pipeline_real_ci.py
          cd src/tests
          python -m unittest test_ml_r12_store test_ml_brepmfr_runtime_fallback test_ml_worker_isolation test_ml_evidence test_ml_active_routes test_ml_runtime_env test_ml_model_assets -v
