name: GeoField integrated verified FEA comparison
on:
  push:
    branches:
      - work/geofield-fea-history-integrate-20261028
    paths:
      - src/fea_compare.py
      - src/tests/test_fea_compare_same_step.py
      - src/tests/test_fea_traction_mode_archive.py
      - src/tests/test_agent_fea_comparison.py
      - .github/workflows/fea-history-comparison-ci.yml
  pull_request:
    branches:
      - work/geofield-fea-execution-a05-20261028
      - work/geofield-ab-ai-c3d10-integration-20261026
    paths:
      - src/fea_compare.py
      - src/tests/test_fea_compare_same_step.py
      - src/tests/test_fea_traction_mode_archive.py
      - src/tests/test_agent_fea_comparison.py
      - .github/workflows/fea-history-comparison-ci.yml
permissions:
  contents: read
jobs:
  verify-history-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check comparison source syntax
        run: python -m py_compile src/fea_compare.py src/tests/test_fea_compare_same_step.py src/tests/test_fea_traction_mode_archive.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run verified history comparison and traction regressions
        env:
          PYTHONPATH: src:src/payload:src/tests
        run: python -m pytest -q src/tests/test_fea_compare_same_step.py src/tests/test_fea_traction_mode_archive.py src/tests/test_agent_fea_comparison.py
