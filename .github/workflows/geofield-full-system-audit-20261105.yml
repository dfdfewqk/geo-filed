name: GeoField full-system DIAGNOSTIC (no release or production edits)
on:
  push:
    branches:
      - work/geofield-full-system-diagnostic-20261105
      - work/geofield-audit-fixes-report-ai-off-20261105
      - work/geofield-report-legacy-status-correction-20261105
      - work/geofield-mesh-three-step-color-progress-20261105
      - work/geofield-stage2-evidence-gate-rootfix-20261105
      - work/geofield-mesh-report-restart-link-20261105
      - work/geofield-report-preview-save-parity-20261105
      - work/geofield-report-three-mesh-numeric-proof-20261105
      - work/geofield-report-single-verification-path-20261105
      - work/geofield-report-verified-3d-snapshots-20261105
      - work/geofield-report-r12-research-evidence-20261105
      - work/geofield-report-ai-narrative-dedup-20261105
      - work/geofield-report-stage8-full-integration-audit-20261106
      - work/geofield-report-completeness-paid-ai-gate-20261106
      - work/geofield-report-section-order-cleanup-20261106
      - work/geofield-cad-ml-ocp-evidence-contrast-20261106
      - work/geofield-report-real-fea-numeric-3d-proof-20261106
      - work/geofield-mesh-d6-report-crosscheck-20261106
  pull_request:
    branches:
      - work/geofield-report-ai-narrative-dedup-20261105
      - work/geofield-report-stage8-full-integration-audit-20261106
      - work/geofield-report-completeness-paid-ai-gate-20261106
      - work/geofield-report-section-order-cleanup-20261106
      - work/geofield-cad-ml-ocp-evidence-contrast-20261106
      - work/geofield-report-real-fea-numeric-3d-proof-20261106
  workflow_dispatch:
permissions:
  contents: read

jobs:
  full-python:
    name: All Python tests and isolated updater contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            py: '3.12'
          - os: windows-latest
            py: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Fetch immutable main and A FEA refs
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/work/fea-validation:refs/remotes/origin/work/fea-validation
      - name: Install broad Python TEST dependencies in isolated CI
        run: python -m pip install pytest numpy "scikit-learn>=1.5,<1.8" joblib
      - name: Compile every Python source without importing it
        run: python -c "import ast,pathlib; f=list(pathlib.Path('src').rglob('*.py')); [ast.parse(x.read_text(encoding='utf8'),filename=str(x)) for x in f]; print('PYTHON_SOURCE_SYNTAX_FILES',len(f))"
      - name: Run every test_*.py (not just selected regression tests)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -c "import sys,unittest; sys.path[:0]=['src','src/payload','src/tests','src/tests/fea_ci_dependencies']; suite=unittest.defaultTestLoader.discover('src/tests',pattern='test_*.py',top_level_dir='src/tests'); result=unittest.TextTestRunner(verbosity=2).run(suite); print('TOTAL_TESTS',result.testsRun,'FAILURES',len(result.failures),'ERRORS',len(result.errors),'SKIPPED',len(result.skipped)); sys.exit(0 if result.wasSuccessful() else 1)"

  verified-report-ai-contract:
    name: Existing verified FEA report and AI OFF/ON no-paid tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest for function-style report regressions
        run: python -m pip install pytest
      - name: Run actual A08 engineering HTML renderer and provenance tests
        env:
          PYTHONPATH: src:src/payload
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q src/tests/test_fea_report_a08.py
          python -m pytest -q src/tests/test_ai_report_evidence_clarity.py

  full-browser:
    name: All frontend browser tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production JS syntax
        run: node --check src/payload/frontend/cad.js
      - name: Run all browser JS test scripts
        shell: bash
        run: |
          set -uo pipefail
          count=0; failed=0
          for f in src/tests/test_*.js; do
            count=$((count+1))
            if ! node "$f"; then echo "::error::FAILED_JS=$f"; failed=$((failed+1)); fi
          done
          echo "TOTAL_SCRIPTS=$count FAILURE_COUNT=$failed"
          test "$failed" -eq 0

  actual-solver:
    name: Real Gmsh and CalculiX original public L-bracket 1+3+3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install real OS FEA binaries in isolated CI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gmsh calculix-ccx
          /usr/bin/python3 -c 'import gmsh; print("REAL_GMSH",gmsh.__version__)'
          which ccx
      - name: STEP to genuine Gmsh CalculiX FRD result
        shell: bash
        env:
          OMP_NUM_THREADS: '2'
          CCX_NPROC_EQUATION_SOLVER: '2'
        run: /usr/bin/python3 src/tests/verify_real_fea_ci.py
      - name: Genuine 3-target-mesh sensitivity study
        shell: bash
        env:
          OMP_NUM_THREADS: '2'
          CCX_NPROC_EQUATION_SOLVER: '2'
        run: /usr/bin/python3 src/tests/verify_three_mesh_real_ci.py
      - name: Genuine C3D10 three-mesh study
        shell: bash
        env:
          OMP_NUM_THREADS: '2'
          CCX_NPROC_EQUATION_SOLVER: '2'
        run: /usr/bin/python3 src/tests/verify_production_c3d10_ci.py
      - name: Retain all real solver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-DIAGNOSTIC-REAL-SOLVER-EVIDENCE-NOT-WINDOWS-PC
          path: |
            _real_fea_evidence/
            _real_fea_three_mesh_evidence/
            _fea_production_c3d10_evidence/
          if-no-files-found: warn
          retention-days: 7

  actual-r12-inference:
    name: Actual R12 research ML inference (no fake model)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated real OCP/CadQuery sklearn deps
        run: python -m pip install "cadquery>=2.5,<2.7" "scikit-learn>=1.5,<1.8" joblib pytest
      - name: Genuine bundled R12 model prediction from generated STEP
        run: python src/tests/test_r12_real_model_inference.py
      - name: No-paid-call R12 preflight and fallback
        run: python -m pytest -q src/tests/test_r12_preflight_safety.py src/tests/test_auto_r12_fallback.py

  windows-line-ending-diagnosis:
    name: Distinguish Windows CRLF-only test failures from source defects
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check actual Git checkout CRLF count, normalize only EPHEMERAL CI copy
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('src/payload/frontend/cad.js'); d=p.read_bytes(); print('CRLF_INPUT',d.count(bytes([13,10])),'LF_INPUT',d.count(bytes([10]))); p.write_bytes(d.replace(bytes([13,10]),bytes([10])))"
      - name: Run the exact three failed Windows UI scripts against same code with Unix newlines
        shell: pwsh
        run: |
          node src/tests/test_b05_fea_delete_ui.js
          node src/tests/test_fea_stage3_auto_unified_report_ui.js
          node src/tests/test_fea_stage6_evidence_display_ui.js
      - name: Run ALL JavaScript browser tests on normalized copy
        shell: bash
        run: |
          set -uo pipefail
          failed=0; total=0
          for f in src/tests/test_*.js; do total=$((total+1)); if ! node "$f"; then failed=$((failed+1)); fi; done
          echo "WINDOWS_NORMALIZED_TOTAL=$total FAILURES=$failed"
          test "$failed" -eq 0

  disposable-windows-update:
    name: Windows CMD launcher, failed update, rollback and source preservation
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable full source-history baselines
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/work/fea-validation:refs/remotes/origin/work/fea-validation
      - name: Real Windows CMD on temp fabricated user runtime only
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_windows_cmd_verify_only_preserves_runtime -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_windows_cmd_install_only_checks_original_and_updated_backend -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_windows_cmd_install_only_failed_updated_health_rolls_back -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_real_cmd_runtime_audit_never_installs_even_when_all_files_present -v
          python -m unittest src.tests.test_integration_candidate.IntegrationCandidateTests.test_user_screenshot_fifteen_unrecognized_files_migrate_as_one_backed_up_set -v
