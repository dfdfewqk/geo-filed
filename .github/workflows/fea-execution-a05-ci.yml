name: GeoField A05 verified FEA executor
on:
  push:
    branches:
      - work/geofield-fea-execution-a05-20261028
    paths:
      - src/payload/fea_solver.py
      - src/payload/GeoField_CAD_Analysis.py
      - src/tests/test_fea_execution_a05.py
      - src/tests/test_fea_progress_stages.py
      - .github/workflows/fea-execution-a05-ci.yml
  pull_request:
    branches:
      - work/geofield-fea-history-delete-a04-20261028
permissions:
  contents: read
jobs:
  verified-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production and test Python
        run: python -m py_compile src/payload/fea_solver.py src/payload/GeoField_CAD_Analysis.py src/tests/test_fea_execution_a05.py src/tests/test_fea_progress_stages.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify execution paths, SQLite archive and restored status
        env:
          PYTHONPATH: src:src/payload:src/tests
        run: python -m pytest -q src/tests/test_fea_execution_a05.py src/tests/test_fea_progress_stages.py src/tests/test_fea_history_a03.py src/tests/test_fea_history_delete_a04.py src/tests/test_sqlite_archive_reverify.py src/tests/test_fea_restore_sqlite_snapshot_binding.py src/tests/test_restore_active_mesh_guard.py src/tests/test_agent_fea_comparison.py
