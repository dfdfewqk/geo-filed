name: GeoField A04 safe FEA deletion
on:
  push:
    branches:
      - work/geofield-fea-history-delete-a04-20261028
    paths:
      - src/fea_history_delete_a04.py
      - src/payload/GeoField_CAD_Analysis.py
      - src/tests/test_fea_history_delete_a04.py
      - .github/workflows/fea-history-a04-ci.yml
  pull_request:
    branches:
      - work/geofield-fea-history-save-a03-20261028
permissions:
  contents: read
jobs:
  guarded-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile backend and deletion tests
        run: python -m py_compile src/fea_history_delete_a04.py src/payload/GeoField_CAD_Analysis.py src/tests/test_fea_history_delete_a04.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test deletion and regression with synthetic SQLite and solver artifacts
        env:
          PYTHONPATH: src:src/payload:src/tests
        run: python -m pytest -q src/tests/test_fea_history_delete_a04.py src/tests/test_fea_history_a03.py src/tests/test_sqlite_archive_reverify.py src/tests/test_fea_restore_sqlite_snapshot_binding.py src/tests/test_restore_active_mesh_guard.py src/tests/test_agent_fea_comparison.py
