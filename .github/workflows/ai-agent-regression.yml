name: GeoField AI evidence agent regression
on:
  push:
    branches: [work/ai-agent-evidence, work/geofield-ab-ai-c3d10-integration-20261026]
  pull_request:
    branches: [work/cad-ml-integration]
    paths:
      - 'src/payload/GeoField_CAD_Analysis.py'
      - 'src/payload/frontend/cad.js'
      - 'src/payload/frontend/index.html'
      - 'src/tests/test_agent_evidence.py'
      - 'src/tests/test_agent_llm.py'
      - 'src/tests/test_agent_restore_binding.py'
      - 'src/tests/test_agent_failure_matrix.py'
      - 'src/tests/test_agent_release_candidate.py'
      - 'src/tests/test_browser_open_fallback.py'
      - 'src/tests/test_acceptance_probe.py'
      - 'src/acceptance_probe.py'
      - 'src/GeoField_Acceptance_Check.cmd'
      - 'src/build_integration_candidate.py'
      - 'src/fetch_prior_candidate.py'
      - 'src/tests/test_candidate_upgrade_chain.py'
      - 'src/runtime_compatibility.py'
      - 'src/tests/test_runtime_compatibility.py'
      - 'src/GeoField_Start.cmd'
      - 'src/GeoField_Repair.cmd'
      - 'src/bootstrap.py'
      - 'src/installer.py'
      - 'src/runtime_preflight.py'
      - 'src/tests/test_agent_release_candidate.py'
      - 'src/tests/test_agent_restore_ui.js'
      - 'src/tests/test_agent_input_contract.py'
      - 'src/tests/test_agent_cad_features.py'
      - 'src/tests/test_agent_fea_spatial.py'
      - 'src/tests/test_agent_fea_comparison.py'
      - 'src/tests/test_agent_fea_compare_ui.js'
      - 'src/tests/test_agent_ui.js'
      - 'src/tests/test_ui_workflow_focus.py'
      - 'src/tests/test_fea_unified_research_ui.js'
      - 'src/tests/test_ui_four_menu_navigation.js'
      - '.github/workflows/ai-agent-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: geofield-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production Python and browser syntax
        run: |
          python -m py_compile src/payload/GeoField_CAD_Analysis.py src/payload/fea_solver.py
          node --check src/payload/frontend/cad.js
          PYTHONPATH="src:src/payload:src/tests/fea_ci_dependencies" python -m unittest discover -s src/tests -p "test_fea_element_mode_integration.py" -v
          PYTHONPATH="src:src/payload:src/tests/fea_ci_dependencies" python -m unittest discover -s src/tests -p "test_fea_production_c3d10.py" -v
      - name: Test agent source trust, FEA archive and ML isolation
        working-directory: src/tests
        run: python -m unittest test_agent_fea_spatial test_agent_fea_comparison test_agent_llm test_agent_restore_binding test_agent_failure_matrix test_acceptance_probe test_runtime_compatibility test_runtime_source_collection test_agent_cad_features test_agent_input_contract test_ui_workflow_focus test_browser_open_fallback test_agent_evidence test_agent_live_report test_fea_report_provenance test_ml_worker_isolation test_sqlite_archive_reverify test_fea_restore_sqlite_snapshot_binding -v
      - name: Test browser agent, ML and FEA identity contracts
        run: |
          node src/tests/test_ui_four_menu_navigation.js
          node src/tests/test_fea_unified_research_ui.js
          node src/tests/test_agent_ui.js
          node src/tests/test_agent_restore_ui.js
          node src/tests/test_agent_fea_compare_ui.js
          node src/tests/test_ml_error_isolation.js
          node src/tests/test_fea_archive_identity.js
          node src/tests/test_fea_restore_element_identity.js
          node src/tests/test_fea_restore_full_browser_flow.js
          node src/tests/test_fea_load_input_guidance.js
          node src/tests/test_fea_material_prepare_race.js
      - name: Existing CAD and FEA boundary regressions
        working-directory: src/tests
        run: python -m unittest test_cad_session_integrity test_ml_integrity test_runtime_preflight test_runtime_source_api_contract -v
      - name: Package LOCAL-ONLY runtime source inventory helper (NOT GeoField release)
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-LOCAL-RUNTIME-SOURCE-REVIEW-HELPER-NOT-INSTALLER
          path: |
            src/runtime_source_collector.py
            src/GeoField_Runtime_Source_Review.cmd
            src/README_Runtime_Source_Review.txt
            src/runtime_preflight.py
          if-no-files-found: error
          retention-days: 7

  agent-ab-real-calculix-ubuntu:
    # Real public-file physics exercise of the exact A+B+AI scratch merge.
    # Distinct from Windows contract tests; does not claim deployment or convergence.
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge production FEA branch in CI scratch tree (do not modify remote branches)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/work/fea-validation:refs/remotes/origin/work/fea-validation
          git -c user.name="GeoField Agent CI" -c user.email="ci@users.noreply.github.com" merge --no-commit --no-ff refs/remotes/origin/work/fea-validation
      - name: Install actual Ubuntu Gmsh and CalculiX
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gmsh calculix-ccx
          /usr/bin/python3 -c 'import gmsh; print("Real gmsh:", gmsh.__version__)'
          command -v ccx
      - name: ACTUAL STEP to Gmsh to CalculiX to INP/STA/FRD and reaction verification
        shell: bash
        env:
          OMP_NUM_THREADS: '2'
          CCX_NPROC_EQUATION_SOLVER: '2'
        run: |
          set -euo pipefail
          /usr/bin/python3 src/tests/verify_real_fea_ci.py
      - name: ACTUAL three distinct mesh solves with same CAD/material/loads
        shell: bash
        env:
          OMP_NUM_THREADS: '2'
          CCX_NPROC_EQUATION_SOLVER: '2'
        run: |
          set -euo pipefail
          /usr/bin/python3 src/tests/verify_three_mesh_real_ci.py
      - name: ACTUAL C3D10 opt-in production three-mesh CalculiX evidence
        shell: bash
        env:
          OMP_NUM_THREADS: '2'
          CCX_NPROC_EQUATION_SOLVER: '2'
        run: |
          set -euo pipefail
          /usr/bin/python3 src/tests/verify_production_c3d10_ci.py
      - name: Retain actual solver input and evidence for independent inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-AB-AI-REAL-GMSH-CALCULIX-VERIFICATION-NOT-CONVERGENCE
          path: |
            _real_fea_evidence/
            _real_fea_three_mesh_evidence/
            _fea_production_c3d10_evidence/
          if-no-files-found: warn
          retention-days: 7

  agent-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real source syntax
        run: |
          python -m py_compile src/payload/GeoField_CAD_Analysis.py
          node --check src/payload/frontend/cad.js
      - name: Agent isolation and Windows SQLite regression
        working-directory: src/tests
        run: python -m unittest test_agent_fea_spatial test_agent_fea_comparison test_agent_llm test_agent_restore_binding test_agent_failure_matrix test_acceptance_probe test_runtime_compatibility test_runtime_source_collection test_agent_cad_features test_agent_input_contract test_ui_workflow_focus test_browser_open_fallback test_agent_evidence test_sqlite_archive_reverify test_ml_worker_isolation -v
      - name: Browser current-CAD and provenance checks
        run: |
          node src/tests/test_ui_four_menu_navigation.js
          node src/tests/test_fea_unified_research_ui.js
          node src/tests/test_agent_ui.js
          node src/tests/test_agent_restore_ui.js
          node src/tests/test_agent_fea_compare_ui.js
  agent-ab-candidate-windows:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge A only in temporary runner (never modify branches)
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/work/fea-validation:refs/remotes/origin/work/fea-validation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -c user.name="GeoField Agent CI" -c user.email="ci@users.noreply.github.com" merge --no-commit --no-ff refs/remotes/origin/work/fea-validation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real candidate with agent and source lock on Windows
        working-directory: src/tests
        shell: pwsh
        run: |
          python -m unittest test_agent_fea_spatial test_agent_fea_comparison test_agent_llm test_agent_restore_binding test_agent_failure_matrix test_acceptance_probe test_runtime_compatibility test_runtime_source_collection test_agent_cad_features test_agent_input_contract test_ui_workflow_focus test_browser_open_fallback test_agent_evidence test_integration_candidate -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify existing browser agent within scratch merged code
        shell: pwsh
        run: |
          node --check src/payload/frontend/cad.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node src/tests/test_ui_four_menu_navigation.js
          node src/tests/test_fea_unified_research_ui.js
          node src/tests/test_agent_ui.js
          node src/tests/test_agent_restore_ui.js
          node src/tests/test_agent_fea_compare_ui.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cross-check A+B+AI integrated FEA solver and CAD/ML/SQLite regression
        shell: pwsh
        run: |
          python -m py_compile src/payload/GeoField_CAD_Analysis.py src/payload/fea_solver.py src/fea_convergence.py src/fea_mesh_series.py src/fea_load_moment.py src/bootstrap.py src/runtime_preflight.py src/runtime_compatibility.py src/installer.py src/build_integration_candidate.py src/acceptance_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location src
          try {
            python -m unittest discover -s tests -p "test_fea_*.py" -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          Push-Location src/tests
          try {
            python -m unittest test_qa_gate test_fea_report_provenance test_runtime_preflight test_runtime_source_api_contract test_cad_session_integrity test_cad_geometry_identity test_ml_integrity test_ml_worker_isolation test_sqlite_archive_reverify test_fea_restore_sqlite_snapshot_binding test_ui_cleanup test_port8600_recovery test_windows_install_safety -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Full browser CAD, ML, FEA, history and agent async race regression
        shell: pwsh
        run: |
          $scripts = @(
            "test_cad_import_race.js","test_cad_evidence_race.js","test_fea_display_provenance.js",
            "test_fea_run_race.js","test_fea_archive_preview_race.js","test_fea_archive_identity.js","test_fea_restore_element_identity.js","test_fea_restore_full_browser_flow.js",
            "test_fea_previous_relink_race.js","test_fea_restore_import_race.js",
            "test_fea_mesh_label_contract.js","test_ml_display.js","test_ml_error_isolation.js"
          )
          foreach ($script in $scripts) {
            node ("src/tests/" + $script)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Load previous SUCCESSFUL distributed candidate, authenticating GitHub artifact SHA-256
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python src/fetch_prior_candidate.py --out (Join-Path $env:RUNNER_TEMP "GeoField_previous_verified_candidate.zip")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test real previous distribution -> current integrated candidate, unknown hash rejection and rollback
        working-directory: src/tests
        shell: pwsh
        run: |
          python -m unittest test_candidate_upgrade_chain -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage 9 verify merged A+B+AI source, dependency gaps, and package hash
        working-directory: src/tests
        shell: pwsh
        run: |
          python -m unittest test_agent_release_candidate test_acceptance_probe test_runtime_compatibility test_ui_workflow_focus test_browser_open_fallback -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage 9 build A+B+AI Windows update CANDIDATE (not final)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "GeoField_AB_AI_CANDIDATE_NOT_FINAL.zip"
          python src/build_integration_candidate.py --output $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = Join-Path $env:RUNNER_TEMP "GeoField_AB_AI_verify"
          Expand-Archive -LiteralPath $target -DestinationPath $folder -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $folder "verify_package.py")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "A+B+AI candidate ZIP: source-locked, NOT final; real user solver/Windows NOT verified."
      - name: Upload SINGLE-EXTRACT Windows candidate folder (no inner ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-20261026-AB-AI-C3D10-ONE-EXTRACT-NOT-FINAL
          path: ${{ runner.temp }}/GeoField_AB_AI_verify/
          if-no-files-found: error
          retention-days: 7
      - name: Download the actual GitHub artifact into a new clean folder
        uses: actions/download-artifact@v4
        with:
          name: GeoField-20261026-AB-AI-C3D10-ONE-EXTRACT-NOT-FINAL
          path: ${{ runner.temp }}/GeoField_AB_AI_downloaded_artifact
      - name: Verify downloadable artifact has only ONE ZIP layer and still passes hashes
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "GeoField_AB_AI_downloaded_artifact"
          foreach ($name in @("START_HERE_ONE_EXTRACT.txt","GeoField_Start.cmd","GeoField_Repair.cmd","bootstrap.py","installer.py","manifest.json","verify_package.py","payload/GeoField_CAD_Analysis.py")) {
            if (-not (Test-Path (Join-Path $folder $name) -PathType Leaf)) {
              throw "Downloaded single-extract candidate missing root-relative file: $name"
            }
          }
          $nested = @(Get-ChildItem -LiteralPath $folder -Filter "*.zip" -Recurse -File)
          if ($nested.Count -ne 0) { throw "Unexpected nested ZIP files: $($nested.FullName -join ', ')" }
          python (Join-Path $folder "verify_package.py")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "[PASS] Actual GitHub artifact has root CMD, 17 payload files and no nested ZIP."
          $candidateFrontend = Get-Content -LiteralPath (Join-Path $folder "payload/frontend/index.html") -Raw
          $candidateBrowser = Get-Content -LiteralPath (Join-Path $folder "payload/frontend/cad.js") -Raw
          $candidateBackend = Get-Content -LiteralPath (Join-Path $folder "payload/GeoField_CAD_Analysis.py") -Raw
          $candidateSolver = Get-Content -LiteralPath (Join-Path $folder "payload/fea_solver.py") -Raw
          if (-not $candidateFrontend.Contains('id="feaElementMode"') -or
              -not $candidateFrontend.Contains('value="c3d10_full" selected') -or
              -not $candidateFrontend.Contains('value="fine" selected') -or
              -not $candidateBrowser.Contains('request.fea_element_mode=mode') -or
              -not $candidateBackend.Contains('case=set_fea_element_mode(') -or
              -not $candidateSolver.Contains('straight_tri6_full_consistent') -or
              -not $candidateBackend.Contains('def gf_agent_evaluate(')) {
            throw "Downloaded Windows artifact lost FEA C3D10 mode or AI agent integration"
          }
          Write-Output "[PASS] Downloaded candidate contains C3D10 selector to SHA-locked case to real FEA and existing AI agent."
          Write-Output "[LIMIT] Existing private GeoField Windows engine and real solver study are not independently tested."
