name: GeoField A11 Windows SQLite handle release
on:
  push:
    branches: [work/geofield-a11-windows-sqlite-close-20261028]
  pull_request:
    branches: [work/geofield-ab-ai-c3d10-integration-20261026]
permissions:
  contents: read
jobs:
  windows-fea-history:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify SQLite FEA archive read/write callbacks release all handles
        working-directory: src
        run: python -m unittest discover -s tests -p "test_fea_history_a03.py" -v
  linux-history:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest for archived FEA provenance and A02 comparison
        run: python -m pip install pytest
      - name: Verify history and same-STEP comparison under temporary SQLite
        env:
          PYTHONPATH: src:src/payload:src/tests
        run: python -m pytest -q src/tests/test_fea_history_a03.py src/tests/test_fea_history_delete_a04.py src/tests/test_fea_compare_same_step.py src/tests/test_sqlite_archive_reverify.py
