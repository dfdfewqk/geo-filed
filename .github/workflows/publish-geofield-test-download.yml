name: Publish verified GeoField test ZIP for direct downloads
on:
  push:
    branches: [work/geofield-direct-download-20261027]
    paths: [.github/workflows/publish-geofield-test-download.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated release-only branch
        uses: actions/checkout@v4
      - name: Authenticate the exact successful source CI run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TESTED_SHA="$(gh api repos/dfdfewqk/geo-filed/actions/runs/40616994129 --jq .head_sha)"
          test "$TESTED_SHA" = "99b6f851ec15f8a92a493ae4618dfeaf73065565"
          TESTED_STATUS="$(gh api repos/dfdfewqk/geo-filed/actions/runs/40616994129 --jq .conclusion)"
          test "$TESTED_STATUS" = "success"
      - name: Download the exact previously verified Windows ZIP artifact files
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 12784999737
          run-id: 40616994129
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true
      - name: Verify candidate and pack one-extract direct-download ZIP
        shell: bash
        run: |
          set -euo pipefail
          python candidate/verify_package.py
          python - <<'PY'
          import hashlib
          import pathlib
          import zipfile
          root=pathlib.Path("candidate")
          expected=("GeoField_Start.cmd","GeoField_Repair.cmd","bootstrap.py",
                    "installer.py","manifest.json","verify_package.py",
                    "payload/frontend/index.html","payload/frontend/cad.js",
                    "payload/GeoField_CAD_Analysis.py")
          for name in expected:
              if not (root/name).is_file():
                  raise RuntimeError("Test candidate is missing: "+name)
          if any(p.suffix.lower()==".zip" for p in root.rglob("*") if p.is_file()):
              raise RuntimeError("Nested ZIP found")
          out=pathlib.Path("dist")
          out.mkdir(exist_ok=True)
          archive=out/"GeoField-Windows-Stability-Full-Fix-20261028.zip"
          with zipfile.ZipFile(archive,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=7) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file():
                      z.write(p,p.relative_to(root).as_posix())
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise RuntimeError("ZIP CRC mismatch")
              if len(z.namelist())!=sum(1 for p in root.rglob("*") if p.is_file()):
                  raise RuntimeError("ZIP file count mismatch")
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          (out/(archive.name+".sha256")).write_text(digest+"  "+archive.name+"\n")
          print("Verified direct-download ZIP:",archive,"SHA256",digest)
          PY
      - name: Publish explicitly non-final public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create geofield-stability-full-fix-20261028 \
            dist/GeoField-Windows-Stability-Full-Fix-20261028.zip \
            dist/GeoField-Windows-Stability-Full-Fix-20261028.zip.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "GeoField CAD ML FEA Agent storage full regression - Windows test candidate (NOT FINAL)" \
            --notes "Direct-download copy of the GitHub Actions verified single-extract candidate from successful run 40616994129. This CI-verified update keeps legacy C3D4 as the default and C3D10 research opt-in, preserves the offline-server acceptance diagnosis, prevents active FEA STEP selection and concurrent solver races, revalidates the exact saved signed FEA case after STEP upload, and read-only recovers uncertain mesh-study terminal status. STEP, SQLite, FRD and ML weights are preserved. NOT a standalone EXE. Real user Windows CAD/FEA/3D is not independently proven by CI. (source 99b6f851ec15f8a92a493ae4618dfeaf73065565). This is NOT a standalone installer. Requires an existing compatible GeoField Windows runtime. Back up original engineering files and check compatibility. No DeepSeek API integration is included. GitHub CI is not an end-to-end test on the user's PC."
          gh release view geofield-stability-full-fix-20261028 --json url,assets
