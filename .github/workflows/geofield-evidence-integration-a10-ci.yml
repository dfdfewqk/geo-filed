name: GeoField restore/compare/AI identity integration
on:
  push:
    branches: [work/geofield-restore-compare-agent-integrate-20261028]
  pull_request:
    branches: [work/geofield-history-ui-a07-20261028]
permissions:
  contents: read
jobs:
  evidence-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend and frontend syntax
        run: |
          python -m py_compile src/payload/GeoField_CAD_Analysis.py src/fea_compare.py
          node --check src/payload/frontend/cad.js
      - name: Install regression runner
        run: python -m pip install pytest
      - name: Independently recheck saved run, restore, comparison and AI report contracts
        working-directory: src
        run: python -m pytest -q tests/test_fea_restore_sqlite_snapshot_binding.py tests/test_fea_compare_same_step.py tests/test_agent_fea_comparison.py tests/test_agent_restore_binding.py tests/test_fea_report_provenance.py tests/test_verified_analysis_report_gate.py
      - name: Validate restored UI and AI compared runs on matching original evidence
        run: |
          node src/tests/test_fea_restore_full_browser_flow.js
          node src/tests/test_agent_fea_compare_ui.js
          node src/tests/test_fea_archive_identity.js
          node src/tests/test_fea_history_ui_a07.js
